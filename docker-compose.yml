# docker compose up  ->  http://localhost:8080
services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    # The API is reached through the web container; uncomment to expose it directly.
    # ports: ["8081:8080"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
