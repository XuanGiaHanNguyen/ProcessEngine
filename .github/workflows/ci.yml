name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPF_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: TSan (server)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPF_SANITIZE_THREAD=ON
      - name: Build
        run: cmake --build build -j --target pf_server_tests
      - name: Test
        run: build/server/tests/pf_server_tests

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19
          sudo apt-get install -y clang-format-19 clang-tidy-19
      - name: clang-format
        run: |
          git ls-files '*.hpp' '*.cpp' | xargs clang-format-19 --dry-run --Werror
      - name: Configure
        env:
          CC: clang-19
          CXX: clang++-19
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - name: clang-tidy
        run: |
          git ls-files 'engine/*.cpp' 'server/*.cpp' 'tools/*.cpp' | grep -v '^engine/bench/' | xargs -r clang-tidy-19 -p build --quiet

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build-bench -DCMAKE_BUILD_TYPE=Release -DPF_BUILD_BENCHMARKS=ON -DPF_BUILD_TESTS=OFF
          cmake --build build-bench -j
      - name: Run
        run: build-bench/engine/bench/pf_bench --benchmark_out=bench.json --benchmark_out_format=json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.json

  web:
    name: Web (lint, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx prettier --check "src/**/*.{ts,html,scss}" "e2e/**/*.ts"
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Build server
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPF_BUILD_TESTS=OFF
          cmake --build build -j --target pf_server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
