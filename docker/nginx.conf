# Serves the Angular build and proxies the API and WebSocket to the server container, so the
# browser talks to a single origin (no CORS needed in production).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /ws/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # Hashed assets can be cached forever; index.html never.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
